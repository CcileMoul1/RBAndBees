name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: RBAndBees_test
          MYSQL_USER: root
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -p$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          
      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -u root -p$MYSQL_ROOT_PASSWORD && exit 0
            sleep 2
          done
          echo "MySQL not ready"
          exit 1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: RBAndBees_test
          DB_USERNAME: root
          DB_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        run: composer setup

      - name: Run Pest tests (verbose)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: RBAndBees_test
          DB_USERNAME: root
          DB_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        run: | 
          php -r "echo getenv('DB_USERNAME').PHP_EOL; echo (getenv('DB_PASSWORD') ? 'PASS_SET' : 'PASS_EMPTY').PHP_EOL;"
          ./vendor/bin/pest -v

      - name: Run CI Checks
        run: composer ci:check
        env:
          PHPSTAN_TURBO: 0
